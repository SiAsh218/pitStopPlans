<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>

  <body>
    {{include_header}}

    <main class="container">
      {{include_modal-role}}

      <section class="page-header">
        <h1>Operational Roles</h1>
      </section>

      <section class="dashboard-toolbar">
        <div class="dashboard-toolbar__controls">
          <label class="dashboard-filter">
            <span>Search</span>
            <input
              id="role-search"
              type="search"
              placeholder="Search by role name"
            />
          </label>
        </div>

        <button id="btn-add-role" class="btn btn-primary">
          Add Operational Role
        </button>
      </section>

      <div id="roles-list">
        <p>Loading operational roles...</p>
      </div>

      <div id="roles-pagination"></div>
    </main>

    <script src="/dist/bundle.js"></script>
  </body>
</html>
