<div class="modal-form hidden" id="modal-form-template-incident-type">
  <div class="modal-form__overlay"></div>

  <div class="modal-form__container">
    <button class="modal-form__close" type="button">&times;</button>

    <div class="modal-form__container-body">
      <h2 class="modal-form__title">Edit Incident Type</h2>
      <p class="modal-form__subtitle">
        Changes apply to all templates for this incident type.
      </p>

      <form class="modal-form__form" id="form-template-incident-type">
        <div class="modal-form__group">
          <label
            class="modal-form__label"
            for="modal-template-incident-type-name"
          >
            Incident Type Name
          </label>
          <input
            class="modal-form__input"
            type="text"
            id="modal-template-incident-type-name"
            required
          />
        </div>

        <div class="modal-form__group">
          <label
            class="modal-form__label"
            for="modal-template-incident-type-description"
          >
            Description
          </label>
          <textarea
            class="modal-form__input"
            id="modal-template-incident-type-description"
            rows="4"
          ></textarea>
        </div>

        <button class="btn btn-primary" type="submit">
          Save Changes
        </button>
      </form>
    </div>
  </div>
</div>
