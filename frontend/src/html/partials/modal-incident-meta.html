<div class="modal-form hidden" id="modal-form-incident-meta">
  <div class="modal-form__overlay"></div>

  <div class="modal-form__container">
    <button class="modal-form__close" type="button">×</button>

    <div class="modal-form__container-body">
      <h2 class="modal-form__title" id="modal-tin-title">
        Update Incident Meta
      </h2>

      <form class="modal-form__form" id="modal-incident-meta-form">
        <input type="hidden" id="modal-incident-meta-incident-id" />

        <div class="modal-form__group">
          <label class="modal-form__label" for="modal-incident-meta-title">
            Incident Title
          </label>

          <input
            class="modal-form__input"
            id="modal-incident-meta-title"
            type="text"
          />
        </div>

        <div class="modal-form__group">
          <label
            class="modal-form__label"
            for="modal-incident-meta-description"
          >
            Incident Description
          </label>

          <textarea
            class="modal-form__input"
            id="modal-incident-meta-description"
            rows="5"
          ></textarea>
        </div>

        <button
          class="btn btn-primary"
          id="modal-incident-meta-submit"
          type="submit"
        >
          Save
        </button>
      </form>
    </div>
  </div>
</div>
