<div class="modal-form hidden" id="modal-form-incident-tin">
  <div class="modal-form__overlay"></div>

  <div class="modal-form__container">
    <button class="modal-form__close" type="button">×</button>

    <div class="modal-form__container-body">
      <h2 class="modal-form__title" id="modal-tin-title">Update TIN Number</h2>

      <form class="modal-form__form" id="modal-tin-form">
        <input type="hidden" id="modal-tin-incident-id" />

        <div class="modal-form__group">
          <label class="modal-form__label" for="modal-tin-number">
            TIN Number
          </label>

          <input
            class="modal-form__input"
            id="modal-tin-number"
            type="text"
            inputmode="numeric"
            pattern="(?:[0-9]+|NA)"
            title="Enter digits or NA"
            required
            placeholder="Digits or NA"
          />
          <p
            class="field-validation-message"
            id="modal-tin-error"
            role="alert"
            hidden
          >
            Enter digits only, or NA.
          </p>
        </div>

        <button class="btn btn-primary" id="modal-tin-submit" type="submit">
          Save TIN Number
        </button>
      </form>
    </div>
  </div>
</div>
