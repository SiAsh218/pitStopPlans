<div class="modal-form hidden" id="modal-form-incident-ccil">
  <div class="modal-form__overlay"></div>

  <div class="modal-form__container">
    <button class="modal-form__close" type="button">×</button>

    <div class="modal-form__container-body">
      <h2 class="modal-form__title" id="modal-ccil-title">
        Update CCIL Number
      </h2>

      <form class="modal-form__form" id="modal-ccil-form">
        <input type="hidden" id="modal-ccil-incident-id" />

        <div class="modal-form__group">
          <label class="modal-form__label" for="modal-ccil-number">
            CCIL Number
          </label>

          <input
            class="modal-form__input"
            id="modal-ccil-number"
            type="text"
            placeholder="Enter CCIL Number"
          />
        </div>

        <button class="btn btn-primary" id="modal-ccil-submit" type="submit">
          Save CCIL Number
        </button>
      </form>
    </div>
  </div>
</div>
