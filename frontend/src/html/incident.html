<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Incident</title>
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>

  <body>
    {{include_header}}
    <main class="container">
      <div class="incident-meta"></div>

      <div id="incident-summary"></div>

      <div id="incident-actions"></div>

      <div id="incident-action-overlay" class="hidden" aria-hidden="true">
        <div class="incident-action-modal" role="dialog" aria-modal="true">
          <button class="incident-action-modal__close" type="button">×</button>
          <section id="incident-action-panel" aria-live="polite"></section>
        </div>
      </div>
    </main>
    <script src="/dist/bundle.js"></script>
  </body>
</html>
