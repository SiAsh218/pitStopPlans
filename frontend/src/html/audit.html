<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>

  <body>
    {{include_header}}

    <main class="container">
      <section class="page-header">
        <h1>Audit Log</h1>
      </section>

      <section class="dashboard-toolbar">
        <div class="dashboard-toolbar__controls">
          <label class="dashboard-filter">
            <span>Entity Type</span>
            <select id="audit-log-entity-type">
              <option value="">All</option>
              <option value="user">User</option>
              <option value="plan_template">Template</option>
              <option value="incident">Incident</option>
            </select>
          </label>

          <label class="dashboard-filter">
            <span>Action</span>
            <select id="audit-log-action-type">
              <option value="">All</option>
              <option value="CREATE_USER">Create User</option>
              <option value="UPDATE_USER">Update User</option>
              <option value="ENABLE_USER">Enable User</option>
              <option value="DISABLE_USER">Disable User</option>
              <option value="CREATE_TEMPLATE">Create Template</option>
              <option value="UPDATE_TEMPLATE">Update Template</option>
              <option value="APPROVE_TEMPLATE">Approve Template</option>
              <option value="CLONE_TEMPLATE">Clone Template</option>
              <option value="RETIRE_TEMPLATE">Retire Template</option>
              <option value="DELETE_DRAFT_TEMPLATE">
                Discarded Draft Template
              </option>
              <option value="CREATE_INCIDENT">Create Incident</option>
              <option value="CLOSE_INCIDENT">Close Incident</option>
              <option value="REOPEN_INCIDENT">Reopen Incident</option>
              <!-- <option value="UPDATE_INCIDENT_CCIL">Update Incident CCIL</option> -->
              <!-- <option value="UPDATE_INCIDENT_TIN">Update Incident TIN</option> -->
            </select>
          </label>

          <label class="dashboard-filter">
            <span>Page size</span>
            <select id="audit-log-page-size">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>

        <button id="audit-log-refresh" class="btn btn-secondary">
          Refresh
        </button>
      </section>

      <div id="audit-log-list"></div>
      <div id="audit-log-pagination"></div>
    </main>

    <!-- Webpack bundle (JS + CSS) -->
    <script src="/dist/bundle.js"></script>
  </body>
</html>
