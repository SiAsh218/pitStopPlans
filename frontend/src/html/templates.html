<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>

  <body>
    {{include_header}}

    <main class="container">
      <section class="templates-page">
        <div class="templates-page__header">
          <div>
            <h1>Plan Templates</h1>
            <p>Review approved and draft versions for each incident type.</p>
          </div>

          <button class="btn btn-primary" id="btn-create-template">
            New Template
          </button>
        </div>

        <section class="dashboard-toolbar">
          <div class="dashboard-toolbar__controls">
            <label class="dashboard-filter">
              <span>Search</span>
              <input
                id="template-search"
                type="search"
                placeholder="Search by template title or incident type"
              />
            </label>

            <label class="dashboard-filter">
              <span>Incident type</span>
              <select id="template-type-filter">
                <option value="all">All</option>
              </select>
            </label>

            <label class="dashboard-filter">
              <span>Status</span>
              <select id="template-status-filter">
                <option value="all">All</option>
                <option value="approved">Approved</option>
                <option value="draft">Draft</option>
              </select>
            </label>
          </div>
        </section>

        <div id="template-list"></div>
      </section>
    </main>

    {{include_modal-template-create}}

    <!-- Webpack bundle (JS + CSS) -->
    <script src="/dist/bundle.js"></script>
  </body>
</html>
