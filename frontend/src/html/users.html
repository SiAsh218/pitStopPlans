<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>

  <body>
    {{include_header}}

    <main class="container">
      {{include_modal-create-user}} {{include_modal-edit-user}}
      <section class="dashboard-toolbar">
        <div class="dashboard-toolbar__controls">
          <label class="dashboard-filter">
            <span>Search</span>

            <input
              id="user-search"
              type="search"
              placeholder="Search by email, role, or job role"
            />
          </label>

          <label class="dashboard-filter">
            <span>Operational Role</span>

            <select id="user-role-filter">
              <option value="all">All</option>
            </select>
          </label>

          <label class="dashboard-filter">
            <span>Application Role</span>

            <select id="user-app-role-filter">
              <option value="all">All</option>
              <option value="admin">Admin</option>
              <option value="editor">Editor</option>
              <option value="user">User</option>
            </select>
          </label>

          <label class="dashboard-filter">
            <span>Status</span>

            <select id="user-status-filter">
              <option value="all">All</option>
              <option value="active">Active</option>
              <option value="disabled">Disabled</option>
            </select>
          </label>
        </div>

        <button id="btn-refresh-users" class="btn btn-secondary">
          Refresh
        </button>
      </section>

      <h2>Users</h2>

      <div class="dashboard-toolbar">
        <button id="btn-create-user" class="btn btn-primary">
          Create User
        </button>
      </div>

      <div id="users-list">
        <p>Loading users...</p>
      </div>

      <div id="user-pagination"></div>

      <div id="user-role-modal" class="hidden"></div>
    </main>

    <script src="/dist/bundle.js"></script>
  </body>
</html>
